name: school-cms

services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the deployment environment}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the deployment environment}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend
    # No published database port; only web and the scanner share this network.

  web:
    build: .
    image: ${SCHOOL_CMS_IMAGE:-school-cms:local}
    restart: unless-stopped
    init: true
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY_FILE: /run/secrets/django_secret_key
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Set DJANGO_ALLOWED_HOSTS in the deployment environment}
      DATABASE_URL_FILE: /run/secrets/database_url
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:?Set the HTTPS CSRF trusted origin}
      DJANGO_TRUST_PROXY: "true"
      DJANGO_HSTS_SECONDS: ${DJANGO_HSTS_SECONDS:-3600}
      DJANGO_HSTS_INCLUDE_SUBDOMAINS: ${DJANGO_HSTS_INCLUDE_SUBDOMAINS:-false}
      DJANGO_HSTS_PRELOAD: ${DJANGO_HSTS_PRELOAD:-false}
      DJANGO_EMAIL_HOST: ${DJANGO_EMAIL_HOST:?Set the production SMTP host}
      DJANGO_EMAIL_PORT: ${DJANGO_EMAIL_PORT:-587}
      DJANGO_EMAIL_HOST_USER: ${DJANGO_EMAIL_HOST_USER:?Set the production SMTP user}
      DJANGO_EMAIL_HOST_PASSWORD_FILE: /run/secrets/smtp_password
      DJANGO_EMAIL_USE_TLS: ${DJANGO_EMAIL_USE_TLS:-true}
      DJANGO_DEFAULT_FROM_EMAIL: ${DJANGO_DEFAULT_FROM_EMAIL:?Set the sender address}
      PRIVATE_FILE_ROOT: /var/lib/schoolcms/private
      PRIVATE_FILE_SCANNER_COMMAND: clamdscan --config-file=/app/deploy/clamdscan.conf --no-summary --stream {path}
      MFA_ENCRYPTION_KEY_FILE: /run/secrets/mfa_encryption_key
    expose:
      - "8000"
    secrets:
      - django_secret_key
      - database_url
      - smtp_password
      - mfa_encryption_key
    volumes:
      - private_files:/var/lib/schoolcms/private
    depends_on:
      db:
        condition: service_healthy
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; host=os.environ['DJANGO_ALLOWED_HOSTS'].split(',')[0].strip(); request=urllib.request.Request('http://127.0.0.1:8000/health/ready/',headers={'Host':host}); urllib.request.urlopen(request, timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - backend
      - edge
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:?Set the public DNS hostname in the deployment environment}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    networks:
      - edge
    security_opt:
      - no-new-privileges:true

  clamav:
    image: clamav/clamav:1.5.4
    restart: unless-stopped
    volumes:
      - clamav_signatures:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping=1:3", "/etc/hostname"]
      interval: 60s
      timeout: 15s
      retries: 10
      start_period: 120s
    networks:
      - backend
      - scanner_egress
    security_opt:
      - no-new-privileges:true

secrets:
  django_secret_key:
    file: ${DJANGO_SECRET_KEY_FILE:?Set DJANGO_SECRET_KEY_FILE to a protected Django secret file}
  database_url:
    file: ${DATABASE_URL_FILE:?Set DATABASE_URL_FILE to a protected PostgreSQL URL file}
  smtp_password:
    file: ${DJANGO_EMAIL_HOST_PASSWORD_FILE:?Set DJANGO_EMAIL_HOST_PASSWORD_FILE to a protected SMTP password file}
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:?Set POSTGRES_PASSWORD_FILE to a protected password file}
  mfa_encryption_key:
    file: ${MFA_ENCRYPTION_KEY_FILE:?Set MFA_ENCRYPTION_KEY_FILE to a protected, separate MFA encryption key file}

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  private_files:
  clamav_signatures:

networks:
  backend:
    internal: true
  edge:
  scanner_egress:
