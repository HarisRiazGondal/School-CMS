{% extends "base.html" %}
{% block title %}Verify sign in · School-CMS{% endblock %}
{% block content %}<section class="panel" style="max-width: 480px; margin: auto"><h1>Verify your sign in</h1><p>Enter a current authenticator code or one unused recovery code.</p>{% if error %}<p role="alert">{{ error }}</p>{% endif %}<form method="post">{% csrf_token %}<label for="code">Authenticator or recovery code</label><input id="code" name="code" autocomplete="one-time-code" required><button class="primary" type="submit">Verify</button></form></section>{% endblock %}
