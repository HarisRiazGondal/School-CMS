{% extends "base.html" %}
{% block title %}Reset password · School-CMS{% endblock %}
{% block content %}<section class="panel" style="max-width: 520px; margin: auto"><h1>Reset your password</h1><p>Enter the email address on your account. If it matches an active account, we’ll send reset instructions.</p><form method="post">{% csrf_token %}{{ form.as_p }}<button class="primary" type="submit">Send reset link</button></form><p><a href="{% url 'login' %}">Back to sign in</a></p></section>{% endblock %}
