name: Django checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sqlite:
    name: SQLite full suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Django checks and SQLite tests
        env:
          DJANGO_DEBUG: "true"
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python manage.py test -v 1

  postgres:
    name: PostgreSQL full suite, deploy check, and restore rehearsal
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: schoolcms
          POSTGRES_USER: schoolcms
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U schoolcms -d schoolcms"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://schoolcms:ci-only-password@localhost:5432/schoolcms
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: ci-only-key-012345678901234567890123456789012345678901234567890
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_CSRF_TRUSTED_ORIGINS: https://localhost
      DJANGO_TRUST_PROXY: "true"
      DJANGO_HSTS_SECONDS: "3600"
      DJANGO_HSTS_INCLUDE_SUBDOMAINS: "false"
      DJANGO_HSTS_PRELOAD: "false"
      DJANGO_EMAIL_HOST: smtp.example.invalid
      DJANGO_EMAIL_PORT: "587"
      DJANGO_EMAIL_HOST_USER: ci@example.invalid
      DJANGO_EMAIL_HOST_PASSWORD: ci-only-password
      DJANGO_EMAIL_USE_TLS: "true"
      DJANGO_DEFAULT_FROM_EMAIL: School CMS CI <ci@example.invalid>
      PRIVATE_FILE_ROOT: ${{ runner.temp }}/schoolcms-private-files
      PRIVATE_FILE_SCANNER_COMMAND: clamdscan --config-file=deploy/clamdscan.conf --no-summary --stream {path}
      PGPASSWORD: ci-only-password
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: schoolcms
      BACKUP_ENCRYPTION_KEY_FILE: ${{ runner.temp }}/schoolcms-backup-key
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install PostgreSQL 17 client and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ca-certificates curl
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --location --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: %s-pgdg\nArchitectures: amd64\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\n' "$VERSION_CODENAME" | sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17
          python -m pip install -r requirements.txt
      - name: Set test-only MFA key
        run: python -c "from cryptography.fernet import Fernet; print('MFA_ENCRYPTION_KEY=' + Fernet.generate_key().decode())" >> "$GITHUB_ENV"
      - name: PostgreSQL migrations, full suite, and production settings check
        run: |
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python manage.py test -v 1
          env DJANGO_DEBUG=false python manage.py check --deploy --fail-level ERROR
          python - <<'PY'
          import os
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "schoolcms.settings")
          os.environ["DJANGO_DEBUG"] = "false"
          import django
          django.setup()
          from django.core.checks import WARNING, run_checks, Tags
          issues = run_checks(tags=[Tags.security], include_deployment_checks=True)
          warnings = [issue for issue in issues if issue.level >= WARNING]
          allowed = {"security.W005", "security.W021"}
          unexpected = [issue for issue in warnings if issue.id not in allowed]
          if unexpected:
              raise SystemExit("Unexpected deployment security warnings: " + ", ".join(issue.id for issue in unexpected))
          PY
          env DJANGO_DEBUG=false python -c "from django.conf import settings; assert settings.DATABASES['default']['ENGINE'] == 'django.db.backends.postgresql'; assert settings.STATIC_ROOT; assert any('whitenoise' in item.lower() for item in settings.MIDDLEWARE)"
      - name: Encrypted PostgreSQL backup and disposable restore rehearsal
        env:
          PGDATABASE: postgres
        run: |
          openssl rand -base64 48 > "$BACKUP_ENCRYPTION_KEY_FILE"
          chmod 600 "$BACKUP_ENCRYPTION_KEY_FILE"
          scripts/restore-rehearsal.sh

  security:
    name: Dependency and source security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pip-audit bandit
      - run: pip-audit -r requirements.txt
      - run: bandit -q -r accounts academics assessment audit finance learning oversight privatefiles schools students schoolcms

  container:
    name: Container build and nonroot static smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: docker build --tag schoolcms:ci .
      - name: Verify nonroot image and manifest on read-only filesystem
        run: >-
          docker run --rm --read-only --tmpfs /tmp --entrypoint python
          -e DJANGO_DEBUG=true schoolcms:ci
          -c "import os; from pathlib import Path; assert os.geteuid()==10001; import django; os.environ.setdefault('DJANGO_SETTINGS_MODULE','schoolcms.settings'); django.setup(); from django.conf import settings; assert (Path(settings.STATIC_ROOT)/'staticfiles.json').is_file()"
