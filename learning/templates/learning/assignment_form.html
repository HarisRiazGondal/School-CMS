{% extends "base.html" %}
{% block title %}New assignment · School CMS{% endblock %}
{% block content %}
<h1>Create assignment</h1><form method="post">{% csrf_token %}{{ form.non_field_errors }}
{% for field in form %}<p>{{ field.label_tag }} {{ field }} {{ field.errors }}</p>{% endfor %}
<button type="submit">Save assignment</button></form>
{% endblock %}
